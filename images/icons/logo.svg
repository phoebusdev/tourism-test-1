<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Mountain silhouette -->
  <path d="M 10 45 L 30 20 L 45 35 L 60 15 L 80 40 L 90 45 Z"
        fill="#2c5f7f" opacity="0.6"/>

  <!-- Church dome/cross element -->
  <g transform="translate(95, 10)">
    <!-- Dome -->
    <path d="M 15 20 Q 15 10 20 10 Q 25 10 25 20 L 23 25 L 17 25 Z"
          fill="#c41e3a"/>
    <!-- Cross -->
    <rect x="19" y="5" width="2" height="8" fill="#d4af37"/>
    <rect x="17" y="8" width="6" height="2" fill="#d4af37"/>
    <!-- Base -->
    <rect x="14" y="25" width="12" height="3" fill="#c41e3a"/>
  </g>

  <!-- Text: Voskopojë -->
  <text x="10" y="55" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#c41e3a" letter-spacing="1">
    VOSKOPOJË
  </text>

  <!-- Decorative elements -->
  <circle cx="5" cy="52" r="1.5" fill="#d4af37" opacity="0.7"/>
  <circle cx="190" cy="52" r="1.5" fill="#d4af37" opacity="0.7"/>
</svg>
